name: Release desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'package.json 中要发布的 semver（例如 1.2.3）'
        required: true
        type: string
      signed:
        description: '已有 Windows 与 Apple 签名凭据时才开启正式签名发布'
        required: true
        default: false
        type: boolean

# Only one release may inspect and advance a channel manifest at a time. Do not
# cancel an older run after it has uploaded immutable packages.
concurrency:
  group: desktop-release-stable
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  LICENSE_REPOSITORY: gongzhaoman0426/judesk-licence
  LICENSE_COMMIT: f968af67fe20b6f164a7cc20f94db620785634cb
  JUDESK_SERVER_URL: https://admin.quantaflow.one
  RELEASE_PUBLIC_BASE_URL: https://updates.quantaflow.one/stable

jobs:
  prepare:
    name: Decide whether to release
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_signed: ${{ steps.release.outputs.release_signed }}
    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4
        with:
          path: judesk
          fetch-depth: 0

      - name: Detect package version release
        id: release
        working-directory: judesk
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIGNED: ${{ inputs.signed }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          version=''
          signed='false'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            [ "$INPUT_SIGNED" = "true" ] && signed='true'
          elif [ "$REF_NAME" = "main" ]; then
            previous=''
            if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
              previous="$(git show "$BEFORE_SHA:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => console.log(JSON.parse(input).version || ''))")"
            fi
            if [ "$current" = "$previous" ]; then
              echo "package.json 版本没有变化（$current），跳过发布。"
              echo 'should_release=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$current"
          else
            echo "当前事件不是 main 分支发布，跳过。"
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的发布版本: $version" >&2
            exit 1
          fi
          if [ "$version" != "$current" ]; then
            echo "发布版本 $version 与 package.json 版本 $current 不一致" >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_signed=$signed" >> "$GITHUB_OUTPUT"

  quality:
    name: Typecheck and test
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: judesk
    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4
        with:
          path: judesk

      - name: Checkout pinned license client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LICENSE_REPOSITORY }}
          ref: ${{ env.LICENSE_COMMIT }}
          token: ${{ secrets.RELEASE_CHECKOUT_TOKEN }}
          path: judesk-license

      - name: Verify pinned license client
        shell: bash
        run: test "$(git -C ../judesk-license rev-parse HEAD)" = "${LICENSE_COMMIT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            judesk/pnpm-lock.yaml
            judesk-license/pnpm-lock.yaml

      - name: Build shared license client
        working-directory: judesk-license
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @judesk/license-client build

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_release == 'true' && needs.quality.result == 'success'
    strategy:
      # Let every platform report its own result. A macOS failure should not
      # hide Windows or the other macOS architecture's diagnostics.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
            electron_args: '--win --x64'
          - name: mac-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            electron_args: '--mac --arm64'
          - name: mac-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            electron_args: '--mac --x64'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: judesk
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      RELEASE_SIGNED: ${{ needs.prepare.outputs.release_signed }}
    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4
        with:
          path: judesk

      - name: Checkout pinned license client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LICENSE_REPOSITORY }}
          ref: ${{ env.LICENSE_COMMIT }}
          token: ${{ secrets.RELEASE_CHECKOUT_TOKEN }}
          path: judesk-license

      - name: Verify pinned license client
        shell: bash
        run: test "$(git -C ../judesk-license rev-parse HEAD)" = "${LICENSE_COMMIT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            judesk/pnpm-lock.yaml
            judesk-license/pnpm-lock.yaml

      - name: Build shared license client
        working-directory: judesk-license
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @judesk/license-client build

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version and production URL
        shell: bash
        run: |
          expected="${RELEASE_VERSION#v}"
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$expected" = "$(node -p "require('./package.json').version")"
          case "$JUDESK_SERVER_URL" in https://*) ;; *) echo "JUDESK_SERVER_URL 必须使用 HTTPS" >&2; exit 1;; esac

      - name: Write production cloud configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('resources/license.json', JSON.stringify({ serverUrl: process.env.JUDESK_SERVER_URL }) + '\n');
          fs.writeFileSync('resources/update.json', JSON.stringify({
            mode: process.env.RELEASE_SIGNED === 'true' ? 'automatic' : 'manual',
          }) + '\n');
          NODE

      - name: Validate signing and notarization credentials
        if: env.RELEASE_SIGNED == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RELEASE_PLATFORM" = darwin ]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          else
            test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD"
          fi

      - name: Build application
        run: pnpm build

      - name: Verify Windows database storage and vector search
        if: matrix.platform == 'win32'
        run: pnpm exec vitest run tests/mastra-storage.test.ts

      - name: Verify Windows upgrade snapshot and Prisma migration
        if: matrix.platform == 'win32'
        env:
          JUDESK_DATABASE_PREPARE_ENTRY: out/main/database-prepare.js
        run: pnpm exec vitest run tests/database-preparation.test.ts tests/service-shutdown.test.ts

      - name: Package signed release
        if: env.RELEASE_SIGNED == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder ${{ matrix.electron_args }} --publish never --config.forceCodeSigning=true --config.mac.notarize=true

      - name: Package unsigned release
        if: env.RELEASE_SIGNED != 'true'
        shell: bash
        run: pnpm exec electron-builder ${{ matrix.electron_args }} --publish never --config.forceCodeSigning=false --config.mac.notarize=false

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'win32' && env.RELEASE_SIGNED == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notlike '*-unpacked*' } | Select-Object -First 1
          if (-not $installer) { throw '没有找到 NSIS 安装包' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows 签名无效: $($signature.Status)" }

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'darwin' && env.RELEASE_SIGNED == 'true'
        shell: bash
        run: |
          app=$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo '没有找到 macOS .app bundle' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "dist"/*.dmg

      - name: Validate exact update artifacts offline
        env:
          RELEASE_PHASE: validate
          RELEASE_DIST: dist
        run: node scripts/publish-release.mjs --validate-only

      - name: Upload release files only
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          # publish-release.mjs consumes only these top-level release files.
          # Uploading dist/ also duplicates the unpacked app and its dependencies.
          path: |
            judesk/dist/*.exe
            judesk/dist/*.dmg
            judesk/dist/*.zip
            judesk/dist/*.blockmap
            judesk/dist/latest.yml
            judesk/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
          # Installers and archives are already compressed; avoid recompressing them.
          compression-level: 0

  publish:
    name: Publish R2 release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: judesk
    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4
        with:
          path: judesk

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: judesk/artifacts
          merge-multiple: false

      - name: Check AWS CLI
        run: aws --version

      # Every architecture's immutable package must be present before any
      # latest*.yml becomes visible to clients.
      - name: Upload immutable packages to R2
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PHASE: artifacts
        run: |
          RELEASE_DIST=artifacts/release-windows-x64 RELEASE_PLATFORM=win32 RELEASE_ARCH=x64 node scripts/publish-release.mjs
          RELEASE_DIST=artifacts/release-mac-arm64 RELEASE_PLATFORM=darwin RELEASE_ARCH=arm64 node scripts/publish-release.mjs
          RELEASE_DIST=artifacts/release-mac-x64 RELEASE_PLATFORM=darwin RELEASE_ARCH=x64 node scripts/publish-release.mjs

      - name: Publish update manifests after all packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PHASE: manifests
        run: |
          RELEASE_DIST=artifacts/release-windows-x64 RELEASE_PLATFORM=win32 RELEASE_ARCH=x64 node scripts/publish-release.mjs
          RELEASE_DIST=artifacts/release-mac-arm64 RELEASE_PLATFORM=darwin RELEASE_ARCH=arm64 node scripts/publish-release.mjs
          RELEASE_DIST=artifacts/release-mac-x64 RELEASE_PLATFORM=darwin RELEASE_ARCH=x64 node scripts/publish-release.mjs

      - name: Verify public update source
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_PUBLIC_BASE_URL: ${{ env.RELEASE_PUBLIC_BASE_URL }}
          RELEASE_PHASE: public-verify
        run: |
          RELEASE_PLATFORM=win32 RELEASE_ARCH=x64 node scripts/publish-release.mjs
          RELEASE_PLATFORM=darwin RELEASE_ARCH=arm64 node scripts/publish-release.mjs
          RELEASE_PLATFORM=darwin RELEASE_ARCH=x64 node scripts/publish-release.mjs
